<html>
<head>
  <title>Create password</title>
</head>
<form action="complete.html">
  <link rel="stylesheet" href="wb/styles/style.css">
<body>
  <img height="50" width="50" alt="logo" src="color.jpg" border="0">
  <h1>Create your own password</h1>
  You have finish in providing your bio-data, so it is time for making a secure password.<br>
  <br>
  <label>Now make a strong password using letters, numbers or special characters.</label><br>
  <hr>
  <br>
  <label for="pwd">Password:</label><br>
<input type="password" id="mypass" placeholder="Enter password" required="mypass"><input type="checkbox" id="toggle1">Show Password<br>
  <ul>  <hr style="width:full;"></ul>
  <br>
  <label for="pass">Rewrite password:</label>
  <br>
  <input type="password" id="password" placeholder="Rewrite password" required="password">
  <input type="checkbox" id="toggle">show password</input>
  
<script>
const passwordInput = document.getElementById('mypass');
  const passwordrewrite =
  document.getElementById('password');
const toggle1 = document.getElementById('toggle1'); 
  const toggle=
  document.getElementById('toggle');

toggle1.addEventListener('click', () => {
const type= passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
  passwordInput.setAttribute('type', type);
});
  toggle.addEventListener('click',() => {
    const type=
    passwordrewrite.getAttribute('type')==='password'? 'text':'password';
    passwordrewrite.setAttribute('type',type);});
</script><br><br>
  <hr>
  <button type="submit" id="pwdset">Next</button>
  
  
</form>
</body>
<footer lang="english">
  thanks for your co-operation

</html>
